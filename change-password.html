<!--loader start-->
<div id="preloader">
    <div class="loader1">
        <span></span>
        <span></span>

    </div>
</div>
<!--loader end-->

<!--body content wrap start-->
<div class="main">

    <!--hero section start-->
    <div class="container-fluid">
        <div class="row align-items-center justify-content-center py-lg-6">

            <div class="col-12 col-md-5 col-lg-6 col-xl-4 px-lg-6">
                <div class="card">
                    <div class="card-body">
                        <div class="login-signup-wrap px-4 px-lg-5 my-5">
                            <!-- Heading -->
                            <h1 class="text-center mb-1">
                                Change Password
                            </h1>
    
                            <!-- Subheading -->
                            <p class="text-muted text-center mb-5">
                                Enter your new password
                            </p>
                            <form action="#" method="post" id="getQuoteFrm" class="login-signup-form ign-up-form">
            <div class="form-group">
                <label class="pb-1">Your Name</label>
                <div class="input-group input-group-merge">
                    <div class="input-icon">
                        <span class="ti-user"></span>
                    </div>
                    <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
                </div>
            </div>
            <div class="form-group">
                <label class="pb-1">Your Email</label>
                <div class="input-group input-group-merge">
                    <div class="input-icon">
                        <span class="ti-email"></span>
                    </div>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="form-group">
                <label class="pb-1">Your Subject</label>
                <div class="input-group input-group-merge">
                    <div class="input-icon">
                        <span class="ti-list"></span>
                    </div>
                    <input type="text" name="subject" class="form-control" placeholder="Enter your subject" required>
                </div>
            </div>
            <div class="form-group">
                <label class="pb-1">Write your message</label>
                <div class="input-group input-group-merge">
                    <div class="input-icon textarea-icon">
                        <span class="ti-comment-alt"></span>
                    </div>
                    <textarea name="message" id="msg" class="form-control" placeholder="Write your message" cols="30" rows="4" required=""></textarea>
                </div>
            </div>
            <!-- Submit -->
            <div class="form-group">
                <input type="submit" name="submit" id="submit" class="btn solid-btn btn-block" value="Send your quarry">
            </div>
            <!-- Link -->
            <div class="form-check d-flex align-items-center text-center">
                <input type="checkbox" class="form-check-input mt-0 mr-3" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">I agree your <a
                        href="#">terms & conditions</a></label>
            </div>
        </form>
                            
                        </div>
                    </div>
                </div>
                
            </div>
        </div> <!-- / .row -->
